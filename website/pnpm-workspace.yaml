# The docs site is an independent project, not part of the root pnpm project.
#
# pnpm finds a project's root by walking up until it finds a
# pnpm-workspace.yaml. Without this file, pnpm run from here walks up to the
# repo root and operates on the react-redux project instead of the site. This
# file stops that walk. It replaces the way the site used to inherit the repo
# root's `.yarnrc.yml` and its pinned `yarnPath` under Yarn.

# Matches the flat layout the site had under Yarn's node-modules linker.
nodeLinker: hoisted

# Keep the content-addressable store inside the site directory so Netlify can
# cache it between builds, the way `.yarn/cache` used to be cached.
storeDir: .pnpm-store

# pnpm blocks dependency install scripts by default and exits non-zero when it
# skips any. Yarn ran them here (the repo root set `enableScripts: true`), so
# these are listed to keep the site installing the way it did before.
allowBuilds:
  '@swc/core': true
  core-js: true

# Security fixes that Docusaurus 3.10's transitive dependency ranges cannot
# reach on their own. Each one is a devDependency of the build or dev server,
# never shipped to the site. Drop an entry once `pnpm audit` is clean without it.
overrides:
  # copy-webpack-plugin@11 and css-minimizer-webpack-plugin@5 pin ^6. 7.0.0's
  # only breaking change is requiring Node 20+.
  'serialize-javascript@6': ^7.0.3
  # sockjs@0.3.24 pins ^8. It only uses `require('uuid').v4`, which uuid 11
  # still exports from its CommonJS entry.
  'uuid@8': ^11.1.1
  # express@4 / body-parser pin ~6.15.
  'qs@6': ^6.16.0
  # In range already, but `pnpm update --depth Infinity` would not move them.
  'ajv@8': ^8.18.0
  'fast-uri@3': ^3.1.4
