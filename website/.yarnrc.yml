# The docs site used to inherit these settings from the repo root's
# .yarnrc.yml, which Yarn found by walking up from this directory. That file
# was deleted when the root project moved to pnpm, so the settings are restored
# here to keep the site installing exactly the way it did before.
#
# compressionLevel is the load-bearing one: Yarn records it in the lockfile's
# cacheKey, and website/yarn.lock was generated with `mixed` (cacheKey: 10).
# Without it Yarn computes cacheKey: 10c0, rewrites the lockfile, and any
# immutable install fails with "The lockfile would have been modified by this
# install, which is explicitly forbidden."
compressionLevel: mixed

# Yarn 4 defaults to Plug'n'Play. The site has always used a node_modules tree.
nodeLinker: node-modules

enableGlobalCache: false
enableScripts: true
