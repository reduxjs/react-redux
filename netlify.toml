[build]
  base    = "website"
  publish = "website/build"
  command = "pnpm install --frozen-lockfile && pnpm build && cp _redirects ./build"
  ignore  = "git diff --quiet HEAD^ HEAD -- ../docs/ .  ../netlify.toml"

[build.environment]
# pnpm 11 requires Node 22.13 or newer.
NODE_VERSION = "22"
NODE_OPTIONS = "--max_old_space_size=4096"


[[plugins]]
  package = "netlify-plugin-cache"
  [plugins.inputs]
    paths = [
      "node_modules/.cache",
      "website/node_modules/.cache",
      ".pnpm-store",
      "website/.pnpm-store"
    ]

